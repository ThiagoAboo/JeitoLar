<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Imprimir cartão JeitoLar</title>
<meta name="robots" content="noindex,nofollow">
<style>
  *{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff}body{display:grid;place-items:center;min-height:100vh;font-family:Arial,sans-serif}.sheet{width:85mm;height:55mm;display:block}.sheet img{display:block;width:85mm;height:55mm;object-fit:fill}.tip{position:fixed;left:12px;right:12px;bottom:12px;text-align:center;font-size:12px;color:#555}@page{size:85mm 55mm;margin:0}@media print{html,body{width:85mm;height:55mm;min-height:0}.tip{display:none}.sheet{margin:0}}
</style>
</head>
<body>
  <div class="sheet"><img src="/card/cartao-jeitolar-85x55mm.png?v=2.8" alt="Cartão de visita JeitoLar"></div>
  <div class="tip">Se a janela de impressão não abrir, use Ctrl+P ou Imprimir no menu do navegador.</div>
<script>window.addEventListener('load',()=>setTimeout(()=>window.print(),350));</script>
</body>
</html>
